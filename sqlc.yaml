version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_json_tags: true
        json_tags_case_style: "snake"
        overrides:
          # UUIDs no nulos
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
            nullable: false
          # UUIDs nulos (ej. refresh_tokens.replaced_by)
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
            nullable: true
          # NUMERIC (puntajes de 0.5 en 0.5 y promedios de 2 decimales) como
          # float64: los valores son pequeños y exactos en binario o redondeados.
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
            nullable: false
          - db_type: "pg_catalog.numeric"
            go_type:
              type: "float64"
              pointer: true
            nullable: true
