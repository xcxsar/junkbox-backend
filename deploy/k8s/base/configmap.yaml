# Configuración no sensible, común a las 4 réplicas. Los secretos (DATABASE_URL,
# JWT_SECRET, Spotify, SMTP) van en el Secret junkbox-common y la clave de
# FreqBlog en freqblog-N (ver deploy/k8s/secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: junkbox-config
data:
  HTTP_ADDR: ":8080"
  ACCESS_TOKEN_TTL: "15m"
  REFRESH_TOKEN_TTL: "168h"
  SEARCH_FALLBACK_THRESHOLD: "0.8"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173"
  FRONTEND_URL: "http://localhost:5173"
  PASSWORD_RESET_TTL: "30m"
  EMAIL_VERIFICATION_TTL: "24h"
  # Mailpit corre fuera del cluster, en la red Docker "kind" (deploy/compose.kind.yml).
  MAIL_DRIVER: "smtp"
  MAIL_FROM: "JunkBox <no-reply@junkbox.local>"
  SMTP_HOST: "mailpit-junkbox"
  SMTP_PORT: "1025"
  SMTP_TLS: "none"
