# GatewayClass es cluster-scoped: queda fuera de base/ para que Kustomize no
# le asigne el namespace junkbox. Usa el EnvoyProxy kind-nodeport de base/gateway.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: junkbox
