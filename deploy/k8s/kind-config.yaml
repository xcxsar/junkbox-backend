# Cluster local: kind create cluster --config deploy/k8s/kind-config.yaml
# El NodePort 30080 del Envoy del Gateway queda en http://localhost:80.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: junkbox
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
