# Réplica 2: Deployment backend-2 con la clave de FreqBlog del Secret freqblog-2.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../backend
nameSuffix: "-2"
labels:
  - pairs:
      replica: "2"
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/name
        value: freqblog-2
