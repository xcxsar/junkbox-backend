# Réplica 3: Deployment backend-3 con la clave de FreqBlog del Secret freqblog-3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../backend
nameSuffix: "-3"
labels:
  - pairs:
      replica: "3"
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/name
        value: freqblog-3
