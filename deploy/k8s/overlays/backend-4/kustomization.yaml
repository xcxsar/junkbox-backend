# Réplica 4: Deployment backend-4 con la clave de FreqBlog del Secret freqblog-4.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../backend
nameSuffix: "-4"
labels:
  - pairs:
      replica: "4"
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/name
        value: freqblog-4
