apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Margen para el shutdown: 10 s del servidor HTTP + 10 s del worker.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: junkbox-backend:dev
          imagePullPolicy: IfNotPresent # la imagen se carga con `kind load`
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: junkbox-config
            - secretRef:
                name: junkbox-common
            - secretRef:
                name: freqblog # cada overlay lo cambia por freqblog-N
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
